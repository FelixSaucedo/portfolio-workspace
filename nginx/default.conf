map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    set $portfolio_scheme $scheme;
    set $portfolio_https $https;
    include /etc/nginx/portfolio-common.conf;

    location / {
        proxy_pass http://ui:5173;
        include /etc/nginx/portfolio-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
