server_name _;
server_tokens off;
client_max_body_size 20m;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

location ~ ^/api(?:/|$) {
    client_max_body_size 64k;
    error_page 413 = @api_payload_too_large;
    error_page 502 503 504 = @api_unavailable;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param HTTP_HOST $host;
    fastcgi_param HTTP_X_REAL_IP $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_PROTO $portfolio_scheme;
    fastcgi_param HTTPS $portfolio_https if_not_empty;
    fastcgi_pass api:9000;
}

location = /storage { return 301 /storage/; }

location /storage/ {
    alias /var/www/storage/app/public/;
    location ~ \.php(?:/|$) { return 404; }
}

location @api_payload_too_large {
    default_type application/json;
    return 413 '{"message":"Payload too large"}';
}

location @api_unavailable {
    default_type application/json;
    add_header Retry-After 30 always;
    return 503 '{"message":"Service unavailable"}';
}
