name: portfolio-ui
services:
  ui:
    build: .
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      - .:/app
      - ui-node-modules:/app/node_modules
    networks: [portfolio-network]
networks:
  portfolio-network:
volumes:
  ui-node-modules:
