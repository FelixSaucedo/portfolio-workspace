name: portfolio-prod
services:
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 64m
    ports: ["80:80"]
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/common.conf:/etc/nginx/portfolio-common.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/portfolio-proxy.conf:ro
      - app-storage:/var/www/storage:ro
    depends_on:
      api: { condition: service_healthy }
      ui: { condition: service_started }
    networks: [portfolio-network]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  api: &api
    image: ${API_IMAGE:-portfolio-api:prod}
    build:
      context: ./felixsaucedo-api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    mem_limit: 640m
    environment:
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: smtp
      MAIL_HOST: ${MAIL_HOST:-mail.smtp2go.com}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-contacto@felixsaucedo.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Félix Saucedo}
      PORTFOLIO_CONTACT_RECIPIENT: ${PORTFOLIO_CONTACT_RECIPIENT:-contacto@felixsaucedo.com}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env.production}
      APP_URL: ${APP_URL:?Define APP_URL en .env.production}
      LOG_CHANNEL: stderr
      PORTFOLIO_ADMIN_NAME: ${PORTFOLIO_ADMIN_NAME:-Félix Saucedo}
      PORTFOLIO_ADMIN_EMAIL: ${PORTFOLIO_ADMIN_EMAIL:-}
      PORTFOLIO_ADMIN_PASSWORD: ${PORTFOLIO_ADMIN_PASSWORD:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: portfolio_db
      DB_USERNAME: portfolio_user
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.production}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes: ["app-storage:/var/www/html/storage"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [portfolio-network]
    logging: *logging
  contact-worker:
    <<: *api
    mem_limit: 192m
    command: ["php", "artisan", "queue:work", "contact-mail", "--queue=contacts", "--sleep=3", "--tries=3", "--timeout=30", "--max-time=3600"]
    stop_grace_period: 45s
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
      db: { condition: service_healthy }
  ui:
    image: ${UI_IMAGE:-portfolio-ui:prod}
    build:
      context: ./felixsaucedo-ui
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    restart: unless-stopped
    mem_limit: 64m
    networks: [portfolio-network]
    logging: *logging
  db:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=30
      - --table-open-cache=400
      - --temptable-max-ram=64M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env.production}
    volumes: ["db-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [portfolio-network]
    logging: *logging

networks:
  portfolio-network:
    name: portfolio-network
volumes:
  db-data:
  app-storage:
